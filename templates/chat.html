{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Chatbot (Django RAG)</title>
    <!-- Bootstrap 4.1 CSS & FontAwesome -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}"/>
</head>
<body>
    <!-- Hidden Django CSRF Token Form Element -->
    {% csrf_token %}

    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100 align-items-center">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <!-- Header -->
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight align-items-center">
                            <div class="img_cont">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img" alt="Medical Bot">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info">
                                <span>Medical Assistant</span>
                                <p>RAG-Powered AI Health Advisor</p>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Body Message Container -->
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Welcome message -->
                        <div class="d-flex justify-content-start mb-4">
                            <div class="img_cont_msg">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot">
                            </div>
                            <div class="msg_cotainer">
                                Hello! I am your AI Medical Assistant. Ask me any health or medical question, and I will search our medical database to assist you.
                                <span class="msg_time">Just now</span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Input Form -->
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Type your medical query..." autocomplete="off" class="form-control type_msg" required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AJAX Script with Django CSRF Protection -->
    <script>
        $(document).ready(function() {
            // Function to retrieve CSRF token generated by Django {% csrf_token %}
            function getCsrfToken() {
                return $('[name=csrfmiddlewaretoken]').val();
            }

            $("#messageArea").on("submit", function(event) {
                event.preventDefault();

                const date = new Date();
                const str_time = date.getHours().toString().padStart(2, '0') + ":" + date.getMinutes().toString().padStart(2, '0');
                var rawText = $("#text").val().trim();

                if (!rawText) return;

                // 1. Render User Message in UI
                var userHtml = '<div class="d-flex justify-content-end mb-4">' +
                    '<div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">' + str_time + '</span></div>' +
                    '<div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg" alt="User"></div>' +
                    '</div>';
                
                $("#text").val("");
                $("#messageFormeight").append(userHtml);
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                // 2. Render Temporary Typing Indicator
                var loadingId = "loading_" + Date.now();
                var loadingHtml = '<div id="' + loadingId + '" class="d-flex justify-content-start mb-4">' +
                    '<div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div>' +
                    '<div class="msg_cotainer"><span class="typing_indicator">Searching medical records... <i class="fas fa-spinner fa-spin"></i></span></div>' +
                    '</div>';
                $("#messageFormeight").append(loadingHtml);
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                // 3. Dispatch Secure AJAX POST Request to Django Backend
                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get/",
                    headers: {
                        "X-CSRFToken": getCsrfToken() // Attach Django CSRF Token Header
                    },
                    dataType: "json",
                }).done(function(data) {
                    $("#" + loadingId).remove();
                    var botAnswer = data.answer || "No response received.";
                    var botHtml = '<div class="d-flex justify-content-start mb-4">' +
                        '<div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot"></div>' +
                        '<div class="msg_cotainer">' + botAnswer + '<span class="msg_time">' + str_time + '</span></div>' +
                        '</div>';
                    $("#messageFormeight").append($.parseHTML(botHtml));
                    $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                }).fail(function(xhr, status, error) {
                    $("#" + loadingId).remove();
                    var errorMsg = "Unable to process request.";
                    if (xhr.responseJSON && xhr.responseJSON.answer) {
                        errorMsg = xhr.responseJSON.answer;
                    } else if (xhr.responseText) {
                        try {
                            var parsed = JSON.parse(xhr.responseText);
                            errorMsg = parsed.answer || parsed.detail || xhr.responseText;
                        } catch(e) {
                            errorMsg = "Server Error (" + xhr.status + "): " + error;
                        }
                    }
                    var errorHtml = '<div class="d-flex justify-content-start mb-4">' +
                        '<div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot"></div>' +
                        '<div class="msg_cotainer" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5;">' +
                        '⚠️ <strong>Error:</strong> ' + errorMsg + 
                        '<span class="msg_time">' + str_time + '</span></div>' +
                        '</div>';
                    $("#messageFormeight").append($.parseHTML(errorHtml));
                    $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                });
            });
        });
    </script>
</body>
</html>
